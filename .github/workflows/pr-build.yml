name: PR Build

on:
  pull_request_target:
    branches:
      - '1.20.*'
      - '1.21.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: |
            ${{ (startsWith(github.base_ref, '1.20') && '17') || '21' }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: |
          ./gradlew build